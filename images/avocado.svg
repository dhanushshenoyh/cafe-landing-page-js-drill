<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="avo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7f2"/>
      <stop offset="100%" stop-color="#e2ebd8"/>
    </linearGradient>
    <linearGradient id="crust-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <linearGradient id="mash-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aed581"/>
      <stop offset="50%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#689f38"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="12" fill="url(#avo-bg)"/>

  <!-- Plate -->
  <ellipse cx="200" cy="205" rx="130" ry="32" fill="#e0e0e0" opacity="0.6"/>
  <ellipse cx="200" cy="200" rx="125" ry="28" fill="#fafafa"/>

  <!-- Sourdough Toast Slice -->
  <path d="M120 170 Q110 130 140 115 Q190 120 250 110 Q280 125 275 165 Q230 190 145 185 Z" fill="url(#crust-grad)"/>
  <path d="M125 167 Q118 135 143 122 Q190 125 246 117 Q272 130 268 163 Q226 184 148 180 Z" fill="#d7ccc8"/>

  <!-- Mashed Avocado Spread -->
  <path d="M135 160 Q128 138 150 128 Q195 130 240 125 Q262 135 258 158 Q220 178 152 175 Z" fill="url(#mash-grad)"/>

  <!-- Radish Slices -->
  <circle cx="165" cy="145" r="14" fill="#f48fb1" stroke="#ec407a" stroke-width="2.5"/>
  <circle cx="165" cy="145" r="10" fill="#fce4ec"/>

  <circle cx="215" cy="140" r="15" fill="#f48fb1" stroke="#ec407a" stroke-width="2.5"/>
  <circle cx="215" cy="140" r="11" fill="#fce4ec"/>

  <circle cx="190" cy="160" r="13" fill="#f48fb1" stroke="#ec407a" stroke-width="2.5"/>
  <circle cx="190" cy="160" r="9" fill="#fce4ec"/>

  <!-- Black Sesame & Chili Flake Seeds -->
  <circle cx="145" cy="150" r="1.5" fill="#212121"/>
  <circle cx="178" cy="132" r="1.5" fill="#212121"/>
  <circle cx="238" cy="148" r="1.5" fill="#212121"/>
  <circle cx="205" cy="168" r="1.5" fill="#212121"/>
  <circle cx="185" cy="146" r="2" fill="#d32f2f"/>
  <circle cx="225" cy="155" r="2" fill="#d32f2f"/>
</svg>
