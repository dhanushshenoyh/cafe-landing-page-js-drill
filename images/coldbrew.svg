      <stop offset="0%" stop-color="#f5ede6"/>
      <stop offset="100%" stop-color="#e8dacf"/>
    </linearGradient>
    <linearGradient id="cold-brew-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d4c41"/>
      <stop offset="25%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#1b0000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="12" fill="url(#cb-bg)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="245" rx="55" ry="12" fill="#d7ccc8" opacity="0.6"/>

  <!-- Glass Container -->
  <path d="M160 50 L168 230 Q200 240 232 230 L240 50 Z" fill="#ffffff" opacity="0.25" stroke="#cfd8dc" stroke-width="3"/>

  <!-- Cold Brew Liquid -->
