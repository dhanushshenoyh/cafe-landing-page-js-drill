  <!-- Ice Cubes floating -->
  <rect x="175" y="110" width="22" height="22" rx="4" transform="rotate(15 186 121)" fill="#ffffff" opacity="0.45" stroke="#b0bec5" stroke-width="1.5"/>
  <rect x="200" y="130" width="24" height="24" rx="4" transform="rotate(-20 212 142)" fill="#ffffff" opacity="0.4" stroke="#b0bec5" stroke-width="1.5"/>
  <rect x="180" y="165" width="20" height="20" rx="3" transform="rotate(8 190 175)" fill="#ffffff" opacity="0.35" stroke="#b0bec5" stroke-width="1.5"/>

  <!-- Nitro Cascading Head Foam -->
  <path d="M161 75 Q200 85 239 75 L238 95 Q200 102 162 95 Z" fill="#fff8e1" opacity="0.95"/>
  <ellipse cx="200" cy="74" rx="39" ry="8" fill="#ffecb3"/>

