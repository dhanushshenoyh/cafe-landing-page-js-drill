<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#faedd9"/>
    </linearGradient>
    <linearGradient id="cr-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9a825"/>
      <stop offset="50%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
    <linearGradient id="cr-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="12" fill="url(#cr-bg)"/>

  <!-- Serving Board -->
  <rect x="70" y="210" width="260" height="20" rx="8" fill="#d7ccc8"/>
  <rect x="75" y="206" width="250" height="10" rx="5" fill="#efebe9"/>

  <!-- Croissant Crescent Body Layers -->
  <!-- Back / Tips -->
  <path d="M100 180 Q130 130 200 120 Q270 130 300 180 Q270 195 200 190 Q130 195 100 180 Z" fill="#b06c1e"/>
  
  <!-- Main Flaky Bulge -->
  <path d="M125 175 Q150 110 200 110 Q250 110 275 175 Q200 188 125 175 Z" fill="url(#cr-gold)"/>

  <!-- Center Laminated Crust Swirls -->
  <path d="M160 170 Q180 115 200 115 Q220 115 240 170 Q200 178 160 170 Z" fill="#ffb74d" stroke="#d84315" stroke-width="2"/>
  <path d="M178 165 Q190 120 200 120 Q210 120 222 165 Q200 172 178 165 Z" fill="url(#cr-light)"/>

  <!-- Flaky Crumbs on Board -->
  <circle cx="115" cy="204" r="2.5" fill="#d84315"/>
  <circle cx="280" cy="203" r="3" fill="#ef6c00"/>
  <circle cx="292" cy="205" r="1.8" fill="#b06c1e"/>
  <circle cx="95" cy="205" r="2" fill="#e65100"/>
</svg>
