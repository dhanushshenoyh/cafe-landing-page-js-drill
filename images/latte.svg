<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="latte-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ef"/>
      <stop offset="100%" stop-color="#eddcd0"/>
    </linearGradient>
    <linearGradient id="mug-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="50%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="12" fill="url(#latte-bg)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="225" rx="85" ry="16" fill="#d7ccc8" opacity="0.6"/>

  <!-- Wide Bowl Mug Handle -->
  <path d="M260 120 C295 120, 295 175, 260 175" fill="none" stroke="#2c3e50" stroke-width="12" stroke-linecap="round"/>

  <!-- Mug Body -->
  <path d="M130 95 L145 190 Q200 220 255 190 L270 95 Z" fill="url(#mug-grad)"/>

  <!-- Coffee Surface Rim -->
  <ellipse cx="200" cy="95" rx="70" ry="24" fill="#a1887f"/>
  <ellipse cx="200" cy="95" rx="66" ry="21" fill="#795548"/>

  <!-- Steamed Milk Microfoam Base -->
  <ellipse cx="200" cy="95" rx="58" ry="17" fill="#d7ccc8"/>

  <!-- Rosetta / Leaf Latte Art -->
  <path d="M200 108 L200 80" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M190 85 Q200 80 210 85" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M185 92 Q200 87 215 92" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M182 100 Q200 95 218 100" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="77" r="4.5" fill="#fff"/>
</svg>
