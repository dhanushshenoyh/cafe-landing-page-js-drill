<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f0e6dc"/>
    </linearGradient>
    <linearGradient id="cup-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="50%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="crema-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#a1887f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="12" fill="url(#bg-grad-1)"/>
  
  <!-- Saucer -->
  <ellipse cx="200" cy="210" rx="95" ry="18" fill="#d7ccc8" opacity="0.6"/>
  <ellipse cx="200" cy="207" rx="90" ry="14" fill="#efebe9"/>
  <ellipse cx="200" cy="206" rx="60" ry="8" fill="#d7ccc8"/>

  <!-- Cup Handle -->
  <path d="M250 140 C280 140, 280 185, 250 185" fill="none" stroke="#4e342e" stroke-width="12" stroke-linecap="round"/>

  <!-- Cup Body -->
  <path d="M140 120 L155 195 Q200 205 245 195 L260 120 Z" fill="url(#cup-grad)"/>

  <!-- Coffee Surface & Crema -->
  <ellipse cx="200" cy="120" rx="60" ry="16" fill="#2d1500"/>
  <ellipse cx="200" cy="121" rx="55" ry="13" fill="url(#crema-grad)"/>

  <!-- Whipped Panna Cream -->
  <path d="M185 118 Q195 95 205 105 Q215 90 220 115 Q210 124 195 124 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="205" cy="102" r="8" fill="#fff9c4"/>

  <!-- Subtle Steam Lines -->
  <path d="M190 85 Q185 65 195 50" fill="none" stroke="#bcaaa4" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M210 80 Q218 62 210 45" fill="none" stroke="#bcaaa4" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
