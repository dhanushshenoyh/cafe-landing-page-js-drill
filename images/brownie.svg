<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="br-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5f0"/>
      <stop offset="100%" stop-color="#ece0d5"/>
    </linearGradient>
    <linearGradient id="choc-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="50%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#2d1500"/>
    </linearGradient>
    <linearGradient id="choc-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1500"/>
      <stop offset="100%" stop-color="#1a0c00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="12" fill="url(#br-bg)"/>

  <!-- Shadow -->
  <polygon points="120,225 280,225 320,185 160,185" fill="#d7ccc8" opacity="0.6"/>

  <!-- Brownie 3D Isometric / Front View -->
  <!-- Bottom Side Left -->
  <polygon points="130,170 130,205 210,218 210,180" fill="url(#choc-side)"/>
  <!-- Bottom Side Right -->
  <polygon points="210,180 210,218 285,188 285,152" fill="#1f0e02"/>

  <!-- Brownie Top Surface -->
  <polygon points="130,170 210,180 285,152 205,142" fill="url(#choc-top)"/>

  <!-- Crinkly Top Crust Crack Lines -->
  <path d="M150 168 Q170 162 195 172" stroke="#5d4037" stroke-width="2" fill="none"/>
  <path d="M185 152 Q210 165 240 156" stroke="#5d4037" stroke-width="2" fill="none"/>
  <path d="M220 168 Q245 162 265 160" stroke="#5d4037" stroke-width="1.5" fill="none"/>

  <!-- Roasted Hazelnut Pieces embedded on top -->
  <circle cx="170" cy="160" r="7" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
  <circle cx="230" cy="155" r="8" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
  <circle cx="205" cy="170" r="6" fill="#d7ccc8" stroke="#8d6e63" stroke-width="1.5"/>

  <!-- Sea Salt Flakes (Maldon crystal pyramids) -->
  <polygon points="150,154 155,151 158,155 153,158" fill="#ffffff" opacity="0.95"/>
  <polygon points="250,158 254,155 257,159 253,162" fill="#ffffff" opacity="0.95"/>
  <polygon points="188,172 192,169 195,173 191,176" fill="#ffffff" opacity="0.95"/>

  <!-- Fudgy Crumbs around base -->
  <rect x="118" y="208" width="5" height="4" rx="1.5" fill="#2d1500"/>
  <rect x="295" y="195" width="4" height="4" rx="1" fill="#2d1500"/>
  <circle cx="218" cy="222" r="2.5" fill="#3e2723"/>
</svg>
